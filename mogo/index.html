<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mogo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:wght@100..900&family=Roboto:wght@100..900&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header__inner">
            <a class="header__logo" href="#" aria-label="MoGo - Home">MoGo</a>
            <nav class="nav" aria-label="Main navigation">
                <ul class="nav__list">
                    <li><a class="nav__link nav__link--active" href="#" aria-current="page">About</a></li>
                    <li><a class="nav__link" href="#">Service</a></li>
                    <li><a class="nav__link" href="#">Work</a></li>
                    <li><a class="nav__link" href="#">Blog</a></li>
                    <li><a class="nav__link" href="#">Contact</a></li>
                </ul>
                <ul class="nav__list nav__list--icons">
                    <li>
                        <!-- shopping cart icon -->
                        <a href="#" class="nav__icon" aria-label="Корзина">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                        </a>
                    </li>
                    <li>
                        <!-- Search icon -->
                        <a href="#" class="nav__icon" aria-label="Поиск">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main>

    <section class="intro" aria-labelledby="intro-title">

        <div class="container intro__container">
            <div class="intro__inner">
                <p class="intro__suptitle">Creative Template</p>
                <h1 class="intro__title" id="intro__title">Welcome to MoGo</h1>
                <a class="btn" href="#">Learn more</a>
            </div>
        </div>

        <div class="slider">
            <div class="container">
                <div class="slider__inner">
                    <div class="slider__list" role="tablist" aria-label="Slides">
                        <button class="slider__item slider__item--active" role="tab" aria-selected="true">
                            <span class="slider__num">01</span> Intro
                        </button>
                        <button class="slider__item" role="tab" aria-selected="false">
                            <span class="slider__num">02</span> Work
                        </button>
                        <button class="slider__item" role="tab" aria-selected="false">
                            <span class="slider__num">03</span> About
                        </button>
                        <button class="slider__item" role="tab" aria-selected="false">
                            <span class="slider__num">04</span> Contacts
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

</body>
</html>
